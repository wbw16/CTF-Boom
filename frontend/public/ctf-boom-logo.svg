<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">CTF-Boom logo</title>
  <desc id="desc">A dark terminal window with a bright explosion spark, followed by the CTF-Boom wordmark.</desc>

  <defs>
    <linearGradient id="terminal" x1="32" y1="34" x2="204" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="frame" x1="42" y1="42" x2="198" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="spark" x1="104" y1="79" x2="160" y2="159" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="spark-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Mark: terminal + controlled burst -->
  <g filter="url(#soft-shadow)">
    <rect x="28" y="28" width="204" height="204" rx="48" fill="url(#terminal)"/>
    <rect x="29.5" y="29.5" width="201" height="201" rx="46.5" fill="none" stroke="#1e3a8a" stroke-width="3"/>
    <path d="M53 80h154" stroke="#334155" stroke-width="2" opacity="0.82"/>
    <circle cx="60" cy="58" r="5" fill="#ff6b5f"/>
    <circle cx="78" cy="58" r="5" fill="#ffb84d"/>
    <circle cx="96" cy="58" r="5" fill="#5eead4"/>

    <path d="M66 111 92 137 66 163" fill="none" stroke="url(#frame)" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/>
    <path d="M194 111 168 137 194 163" fill="none" stroke="url(#frame)" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/>
    <path d="M105 174h50" stroke="#93c5fd" stroke-linecap="round" stroke-width="8" opacity="0.92"/>

    <g filter="url(#spark-glow)">
      <path d="m130 91 8 25 24-8-13 23 22 13-27 3 3 27-17-20-18 20 4-27-27-3 22-13-13-23 24 8z" fill="url(#spark)"/>
      <circle cx="130" cy="137" r="10" fill="#fff7d6" opacity="0.9"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="SF Pro Display, Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="750">
    <text x="280" y="158" fill="#0f172a" font-size="88" letter-spacing="-4">CTF</text>
    <text x="451" y="158" fill="#f97316" font-size="88" letter-spacing="-4">-</text>
    <text x="493" y="158" fill="#1769e0" font-size="88" letter-spacing="-4">Boom</text>
  </g>

  <path d="M284 185h403" stroke="#dbeafe" stroke-linecap="round" stroke-width="6"/>
  <path d="M284 185h104" stroke="#f97316" stroke-linecap="round" stroke-width="6"/>
</svg>
